openapi: 3.1.0
info:
  title: Hookrelay API
  version: 0.1.0
  summary: Publish webhooks with one API call; Hookrelay signs, delivers, retries and logs them.
  description: |
    Hookrelay is a small, self-hostable webhook sending service.

    ## Conventions
    - **Auth (ADR 0011):** every `/v1/*` route except `POST /v1/projects` needs exactly one credential:
      `Authorization: Bearer <api_key>` (programmatic clients), or `X-Hookrelay-Session: <Neon Auth session>`
      (sent only by the dashboard BFF, never by browsers). `POST /v1/me/project` accepts only the session.
      A missing, malformed, unknown, revoked, expired or signed-out credential, and a request that sends both,
      all return `401 unauthorized` with an identical body. A request without a credential never reaches the
      identity provider. If Neon Auth cannot verify a session (timeout, error), the API fails closed with
      `503 auth_unavailable`. A verified user who has no project yet gets `409 project_not_provisioned`
      (call `POST /v1/me/project`).
    - **Tenant isolation:** a resource owned by another project returns `404 not_found`, never `403`.
    - **Errors:** always `{"error":{"code":"<snake_case>","message":"...","field":"<optional>"}}`.
      5xx responses never contain stack traces or SQL.
    - **Pagination:** cursor based. `limit` defaults to 20, max 100 (above 100 returns 400).
      Responses are `{"data":[...],"next_cursor":"..."|null}`. `next_cursor` is `null` on the last page.
      Cursors are opaque; do not parse them.
    - **IDs:** opaque strings with a type prefix (`proj_`, `key_`, `ep_`, `msg_`, `dlv_`, `att_`) followed by a ULID.
    - **Timestamps:** RFC 3339, UTC.
    - **Request IDs:** every response carries `X-Request-Id`: echoed from the request when it matches
      `^[A-Za-z0-9._-]{1,64}$`, otherwise generated.
    - **Content-Type:** request bodies are parsed as JSON whatever `Content-Type` the client sends
      (lenient by design; there is no `415`).
    - **Body limit:** request bodies larger than 256 KB (262144 bytes) return `413 payload_too_large`. Nothing is stored.
    - **Environment mode:** `development` allows `http://` and `localhost` endpoint URLs. `production` requires
      `https://` and blocks private, loopback, link-local and unique-local destinations.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8080
    description: Local development (docker compose)
  - url: https://hookrelay.fly.dev
    description: Public demo (production mode)

security:
  - apiKey: []
  - session: []

tags:
  - name: system
  - name: projects
  - name: endpoints
  - name: messages
  - name: deliveries
  - name: demo

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health check including database reachability
      security: []
      responses:
        "200":
          description: The process is up and the database answered within 1 second.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok, checks: { database: ok } }
        "503":
          description: The database is unreachable or did not answer in time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: unavailable, checks: { database: unreachable } }

  /v1/projects:
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project and receive its API key (shown once)
      description: |
        Disabled in production by configuration (`PROJECT_CREATION_ENABLED=false`), in which case it
        returns `403 forbidden` and creates nothing. Enabled by default in development mode.
        The plaintext `api_key` is returned only in this response and is never stored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
            example: { name: Acme }
      responses:
        "201":
          description: Project created.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCreated" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/project:
    get:
      tags: [projects]
      operationId: getCurrentProject
      summary: Get the project the API key belongs to
      responses:
        "200":
          description: The authenticated project. Contains no key material.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/ProjectNotProvisioned" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/me/project:
    post:
      tags: [projects]
      operationId: ensureMyProject
      summary: Get or create the signed-in user's project (API key shown once, on creation)
      description: |
        Idempotent. Each Neon Auth user owns exactly one project. The first call creates it (name "My project")
        with an API key and returns `201`. That response is the only place the plaintext `api_key` ever
        appears. Every later call, including concurrent ones that lost the race, returns `200` with the
        project and no key. The dashboard calls this before any other API request. No request body.
        Session only: an API key is not accepted here.
      security:
        - session: []
      responses:
        "200":
          description: The project already existed. No key material.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "201":
          description: Created by this call. `api_key` is shown once and cannot be retrieved again.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/endpoints:
    get:
      tags: [endpoints]
      operationId: listEndpoints
      summary: List endpoints, newest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of endpoints. List items never contain `signing_secret`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EndpointList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/ProjectNotProvisioned" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    post:
      tags: [endpoints]
      operationId: createEndpoint
      summary: Register a receiver URL; returns its signing secret
      description: |
        Validation: `url` must be an absolute `http(s)` URL of at most 2048 characters with no embedded
        credentials; `description` at most 255 characters and never `null`. In production mode the URL must be
        `https://` and its host must not be, or resolve to, a loopback, private (RFC 1918), link-local
        (incl. `169.254.169.254`), CGNAT, unique-local IPv6 or other non-public address. The single exception is the
        built-in demo receiver (`Project.demo_receiver_url`, ADR 0017): a URL with exactly its scheme, host and port
        and a path under its base path (no `.`/`..` segments) skips these rules. Other paths or ports on the same host
        do not. A deployment may also accept *only* demo receiver URLs (`OUTBOUND_ALLOWLIST_ONLY`), in which case any
        other URL returns `400`. A hostname that cannot be resolved (no records, DNS
        error or timeout) is rejected with `400 validation_error`, field `url`. Registration makes no HTTP call
        to the URL.

        A project may have at most `MAX_ENDPOINTS_PER_PROJECT` endpoints (20 by default), disabled ones included.
        Creating more returns `409 conflict` with a message that names the limit. The limit holds under
        concurrent requests. `409 project_not_provisioned` is also possible for a session without a project.

        This response and `GET /v1/endpoints/{endpoint_id}/secret` are the only places the signing secret appears.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEndpointRequest" }
            example: { url: "https://example.com/hook", description: Acme prod }
      responses:
        "201":
          description: Endpoint created. `signing_secret` is included.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EndpointWithSecret" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/endpoints/{endpoint_id}:
    parameters:
      - $ref: "#/components/parameters/EndpointID"
    get:
      tags: [endpoints]
      operationId: getEndpoint
      summary: Get one endpoint (without its secret)
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Endpoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectNotProvisioned" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    patch:
      tags: [endpoints]
      operationId: updateEndpoint
      summary: Update url, description and/or enabled
      description: |
        Partial update. A field that is absent stays unchanged. A field that is present is validated and applied.
        No field is nullable: an explicit `null` returns `400 validation_error` with that field, and it is never
        treated as absent. To clear `description`, send `""`. At least one field is required; `{}` returns
        `400 validation_error` with field `body`. The same validation rules as create apply, and `url` is
        re-checked whenever it is present, even if unchanged. The secret is not affected.

        Every successful patch sets `updated_at`, even if the values did not change. Disabling an endpoint makes
        its not-yet-attempted deliveries fail with `endpoint_disabled` when they come due. Concurrent patches of
        different fields do not overwrite each other.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEndpointRequest" }
            example: { enabled: false }
      responses:
        "200":
          description: The updated endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Endpoint" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectNotProvisioned" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/endpoints/{endpoint_id}/secret:
    parameters:
      - $ref: "#/components/parameters/EndpointID"
    get:
      tags: [endpoints]
      operationId: getEndpointSecret
      summary: Reveal the endpoint's signing secret
      responses:
        "200":
          description: The signing secret.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EndpointSecret" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectNotProvisioned" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/endpoints/{endpoint_id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/EndpointID"
    get:
      tags: [deliveries]
      operationId: listEndpointDeliveries
      summary: List one endpoint's deliveries, newest first, optionally filtered by status
      description: |
        Ordered by `created_at` descending (the publish time of the message), then `id` descending. A disabled
        endpoint is still listed. Order of checks: a malformed path ID is `404`; then `status`, `limit` and
        `cursor` are validated (`400`, the same for every ID, so it reveals nothing); then an unknown endpoint or
        one of another project is `404 not_found`. The cursor does not remember the `status` filter: send the same
        `status` with every page (ADR 0015).
      parameters:
        - name: status
          in: query
          required: false
          description: |
            Only return deliveries in this status. Absent means every status. An empty value, any other value,
            or the parameter sent more than once returns `400 validation_error` with field `status`.
          schema: { $ref: "#/components/schemas/DeliveryStatus" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of deliveries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectNotProvisioned" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/messages:
    get:
      tags: [messages]
      operationId: listMessages
      summary: List messages, newest first, with a delivery summary
      description: |
        Ordered by `created_at` descending, then `id` descending. Items never contain `payload` (fetch one message
        for it). `delivery_summary` counts the message's deliveries by status at read time; it is read just after
        the page, so it can be a few milliseconds newer than the page itself (ADR 0015). A message published while
        no endpoint was enabled has all counts at `0`. A message whose publish commits while you page can appear
        on page 1 after you have read page 2 (its `created_at` is taken before its transaction commits); refresh
        page 1 to see the newest messages.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of messages (without payloads).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/ProjectNotProvisioned" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    post:
      tags: [messages]
      operationId: publishMessage
      summary: Publish an event; fans out to every enabled endpoint asynchronously
      description: |
        Returns `202` only after the message and one `pending` delivery per endpoint that is enabled at that
        moment have been committed together in one transaction. If the write fails, the response is `500` and
        neither the message nor any delivery exists. Publishing makes no outbound HTTP call, so it succeeds even
        when every receiver is offline. Endpoints registered (or re-enabled) later do not receive this message;
        a project with no enabled endpoints still gets `202`, with 0 deliveries.

        **Order of checks** (the first failure wins): credential (`401`/`409`/`503`) → body size (`413`, decided
        before the body is parsed; nothing is stored) → JSON shape (`400`, unknown fields and trailing data are
        rejected; a field of the wrong type is named in `field`) → `event_type` (`400`, field `event_type`) →
        `payload` (`400`, field `payload`) → `Idempotency-Key` header (`400`, field `Idempotency-Key`) →
        idempotency (`202` replay or `422`).

        **Idempotency:** send `Idempotency-Key` to make retries safe. Keys are scoped per project: the same key
        in two projects creates two messages. A key stays live for 24 hours from the first successful request
        with it.
        - Same key, *identical* request (same `event_type` and byte-identical `payload`; whitespace and key order
          inside `payload` count): `202` with the **same body as the original response** (same `id`, `event_type`
          and `created_at`) plus header `Idempotent-Replayed: true`. Nothing new is created, and endpoints added
          since the original publish get nothing.
        - Same key, different request: `422 idempotency_key_mismatch`. Nothing is created.
        - Concurrent requests with the same key: exactly one message is created. The others wait for it to commit,
          then get the replay (or `422` if their body differs).
        - A request that fails (`4xx` before the replay check, or `500`) does not consume its key, so the client
          can retry with the same key.
        - After 24 hours the key is free again, and the next request with it creates a new message.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishMessageRequest" }
            example:
              event_type: invoice.paid
              payload: { id: inv_1, amount: 1200 }
      responses:
        "202":
          description: |
            Accepted: the message and its deliveries are committed and queued. A replay of an earlier request with
            the same `Idempotency-Key` returns the same status and the same body as that original response, plus
            `Idempotent-Replayed: true`. The header is absent on a first publish.
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageAccepted" }
              examples:
                created:
                  summary: First publish
                  value: { id: msg_01JC3ZP4A5B6C7D8E9F0G1H2J3, event_type: invoice.paid, created_at: "2026-11-13T09:30:00.123456Z" }
                replayed:
                  summary: Replay with the same Idempotency-Key (identical body; header Idempotent-Replayed is true)
                  value: { id: msg_01JC3ZP4A5B6C7D8E9F0G1H2J3, event_type: invoice.paid, created_at: "2026-11-13T09:30:00.123456Z" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/ProjectNotProvisioned" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/IdempotencyKeyMismatch" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/messages/{message_id}:
    parameters:
      - $ref: "#/components/parameters/MessageID"
    get:
      tags: [messages]
      operationId: getMessage
      summary: Get a message with its exact payload and all its deliveries
      description: |
        `payload` is returned byte-for-byte as published (embedded as raw JSON). `deliveries` is not paginated:
        a message has at most one delivery per endpoint, and a project has at most 20 endpoints. Deliveries are
        ordered by `id` ascending (the order they were created at publish). It is an empty array when no endpoint
        was enabled at publish.
      responses:
        "200":
          description: The message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectNotProvisioned" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/deliveries/{delivery_id}/attempts:
    parameters:
      - $ref: "#/components/parameters/DeliveryID"
    get:
      tags: [deliveries]
      operationId: listDeliveryAttempts
      summary: List a delivery's attempts, oldest first
      description: |
        Ordered by `attempt_number` ascending (the one exception to newest-first lists). Paginated like every list:
        the default `limit` of 20 holds the whole default retry schedule (6 automatic attempts) in one page, and
        manual replays (US-007) can add attempts without bound. The cursor of this list encodes an attempt number,
        so a cursor from another list returns `400` (field `cursor`). A delivery with no finished attempt yet
        returns an empty `data`. An attempt in flight is not listed until it finishes. A delivery that failed
        because its endpoint was disabled has a last attempt with `error: endpoint_disabled`, `response_status:
        null` and `duration_ms: 0` (no request was made).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of attempts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectNotProvisioned" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /v1/deliveries/{delivery_id}/replay:
    parameters:
      - $ref: "#/components/parameters/DeliveryID"
    post:
      tags: [deliveries]
      operationId: replayDelivery
      summary: Manually re-send a `failed` or `succeeded` delivery
      description: |
        Moves the delivery back to `pending` for one **manual** attempt (ADR 0016). The worker makes that attempt
        within seconds (it polls every 500 ms), with the same `webhook-id` (the message ID) and the same body
        bytes, a fresh `webhook-timestamp` and a signature recomputed for it, to the endpoint's **current** URL
        and secret. The attempt is listed with `trigger: manual` and the next `attempt_number`; earlier attempts
        are never changed. If the manual attempt fails, the delivery becomes `failed` again and is **not**
        retried automatically. A worker crash during the attempt does not count as a failure: the same manual
        attempt is made again after the lease expires (about 30 s), with the same `attempt_number`.

        **Order of checks:** a malformed path ID is `404`; then an unknown delivery or one of another project is
        `404 not_found` ("delivery not found"); then a disabled endpoint is `409 conflict` ("endpoint is
        disabled"); then a delivery that is `pending` (waiting for its first attempt or a scheduled retry, or
        with an attempt in flight) is `409 conflict` ("delivery is already pending"). A `409` makes no attempt
        and changes nothing.

        **Concurrency:** the state change is one conditional update, so of two concurrent replays of the same
        delivery exactly one gets `202` and the other `409` ("delivery is already pending"). At most one
        attempt per delivery is ever queued or in flight.

        **Not idempotent:** there is no `Idempotency-Key`. Retrying a replay request after the first replay has
        already finished starts another manual attempt. Receivers deduplicate by `webhook-id`, so a receiver
        that already processed this message may ignore the replay by design.

        The endpoint's state is checked when the request arrives. If the endpoint is disabled after the `202`
        but before the attempt, the attempt is recorded with `error: endpoint_disabled` (no request is sent) and
        the delivery becomes `failed`. There is no request body; any body sent is ignored.
      responses:
        "202":
          description: |
            Replay queued. Returns the delivery in its new state: `status: pending`, `next_attempt_at` set to
            the time of the request, `attempt_count` and `last_attempt_at` unchanged. Poll
            `GET /v1/deliveries/{delivery_id}/attempts` to see the manual attempt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
              example:
                id: dlv_01JC3ZM2H7Y9D4E6F8G0J1K2M3
                message_id: msg_01JC3ZP4A5B6C7D8E9F0G1H2J3
                endpoint_id: ep_01JC3ZM2H7Y9D4E6F8G0J1K2M3
                status: pending
                attempt_count: 6
                next_attempt_at: "2026-11-19T10:15:00.123456Z"
                last_attempt_at: "2026-11-19T09:12:41.004512Z"
                created_at: "2026-11-19T07:54:02.511904Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: The delivery does not exist, belongs to another project, or the path ID is malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: not_found, message: "delivery not found" } }
        "409": { $ref: "#/components/responses/ReplayConflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /demo/receiver/{project_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        description: |
          The project whose demo endpoints may be sending to this URL. A value that is not a well-formed project ID
          returns `404 not_found`. A well-formed but unknown project returns the same `401` as a bad signature, so
          the response never says whether a project exists.
        schema: { $ref: "#/components/schemas/ProjectID" }
    post:
      tags: [demo]
      operationId: demoReceive
      summary: Built-in demo receiver that verifies signatures and can fail on purpose
      description: |
        A receiver for demos and E2E tests, hosted by the API process (ADR 0017). Register `demo_receiver_url`
        (see `Project.demo_receiver_url`) as an endpoint URL, either exactly as given or followed by `?fail_first=N`.
        `hookrelay seed` creates two such endpoints in the demo project: a healthy one and one with `?fail_first=2`.

        **Not authenticated with an API key:** the Standard Webhooks signature is the credential. Only registered when
        `DEMO_RECEIVER_ENABLED=true`; otherwise every request gets `404 not_found` ("route not found").

        **Order of checks** (the first failure wins):
        1. `project_id` well formed, else `404`.
        2. `fail_first` an integer from 0 to 10, sent at most once, else `400 validation_error` (field `fail_first`).
        3. Body at most 256 KB (`MAX_BODY_BYTES`), else `413`. The body is treated as raw bytes and never parsed, so any
           content (also non-JSON or empty) is accepted if it is signed. `Content-Type` is ignored.
        4. Exactly one `webhook-id`, `webhook-timestamp` and `webhook-signature` header, well formed, else `401`.
        5. `webhook-timestamp` within 5 minutes of the server clock in either direction, else `401` with the message
           "webhook timestamp is outside the 5 minute tolerance".
        6. At least one `v1` signature in `webhook-signature` matches (constant-time compare) the HMAC computed with
           the signing secret of one of this project's **demo endpoints**: endpoints whose `url` is exactly
           `demo_receiver_url`, or `demo_receiver_url` followed by `?` and a query string. Otherwise `401`
           "invalid webhook signature". That includes an unknown project and a project with no demo endpoints. The
           endpoint whose secret matched is the one the request is counted for.
        7. The request is counted per (endpoint, `webhook-id`). **Only requests that passed step 6 are counted.** If
           the count is at most `fail_first`, the answer is `500 simulated_failure` ("request n of N"); otherwise `200`.

        Retries and replays of a message reuse its `webhook-id`, so with `fail_first=2` and the default retry schedule
        a delivery shows two failed attempts (about 5 s and 30 s apart) and then a success. Each demo endpoint counts on
        its own, so one message fanned out to a healthy and a flaky demo endpoint succeeds at once on the first and on
        the third attempt on the second. A count that has been idle for more than 7 days starts again from 1.

        The response bodies below are stored as the attempt's response body (first 4 KB) and contain only IDs and
        counters. No rate limit applies yet (US-012). A request that fails at step 6 or earlier writes nothing.
      security: []
      parameters:
        - name: fail_first
          in: query
          required: false
          description: |
            Number of initial requests per (endpoint, webhook-id) to answer with `500 simulated_failure`. `0` (the default)
            never fails. Values 6 and above make every automatic attempt of the default schedule fail, so only a manual
            replay can succeed.
          schema: { type: integer, minimum: 0, maximum: 10, default: 0 }
        - $ref: "#/components/parameters/DemoWebhookIDHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: false
        description: Any bytes up to 256 KB, verified exactly as received. Hookrelay sends the published JSON payload.
        content:
          application/json:
            schema: {}
            example: { "id": "inv_1", "amount": 1200 }
      responses:
        "200":
          description: Signature valid and the failure budget is used up (or `fail_first` is 0). Request accepted.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoReceiverResult" }
              example:
                received: true
                endpoint_id: ep_01JC3ZM2H7Y9D4E6F8G0J1K2M3
                webhook_id: msg_01JC3ZP4A5B6C7D8E9F0G1H2J3
                request_number: 3
                fail_first: 2
        "400":
          description: "`fail_first` is not an integer from 0 to 10, or it was sent more than once."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: validation_error, message: "fail_first must be between 0 and 10", field: fail_first } }
        "401":
          description: |
            Missing, repeated or malformed webhook headers, a timestamp outside the 5-minute tolerance, or no matching
            signature (this includes an unknown project and a project without demo endpoints). Nothing was counted.
            Code `unauthorized`, with a `WWW-Authenticate` header as on every 401.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                invalidSignature:
                  summary: Bad, missing or unmatched signature, or unknown project (identical body)
                  value: { error: { code: unauthorized, message: "invalid webhook signature" } }
                staleTimestamp:
                  summary: webhook-timestamp more than 5 minutes from the server clock
                  value: { error: { code: unauthorized, message: "webhook timestamp is outside the 5 minute tolerance" } }
        "404":
          description: The demo receiver is disabled on this deployment, or `project_id` is not a well-formed project ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                disabled:
                  summary: DEMO_RECEIVER_ENABLED=false (the route does not exist)
                  value: { error: { code: not_found, message: "route not found" } }
                malformedProjectID:
                  summary: project_id is not proj_ followed by 26 Crockford base32 characters
                  value: { error: { code: not_found, message: "demo receiver not found" } }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500":
          description: |
            A simulated failure (`code` is `simulated_failure`; the request was counted, and `n` is its number), or a
            genuine internal error (`code` is `internal`). Hookrelay records either one as a failed attempt and retries
            it on the normal schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                simulatedFailure:
                  summary: Failing on purpose
                  value: { error: { code: simulated_failure, message: "demo receiver failing on purpose (request 1 of 2)" } }
                internal:
                  summary: Unexpected error
                  value: { error: { code: internal, message: "internal server error" } }

webhooks:
  messageDelivery:
    post:
      summary: What Hookrelay sends to a registered endpoint
      description: |
        One `POST` per delivery attempt, sent by the worker process (never by the API), usually within
        a second of publish. Signed with the endpoint's secret using the
        [Standard Webhooks](https://www.standardwebhooks.com/) scheme:
        `webhook-signature: v1,<base64(HMAC-SHA256(key, "{webhook-id}.{webhook-timestamp}.{body}"))>`,
        where `key` is the base64-decoded part of `whsec_<base64>` and `body` is the raw request body.
        Multiple signatures may be space-separated (reserved for secret rotation, P1).

        **Verifying:** read the raw body bytes before any JSON parsing, recompute the signature with a
        constant-time compare, and reject timestamps more than 5 minutes from your clock. Any Standard
        Webhooks library does all three.

        **Request:** the body is the published `payload`, byte-for-byte (whitespace and key order kept).
        Header names are sent in lowercase as the spec writes them (HTTP header names are case-insensitive).
        `content-type` is exactly `application/json`. `webhook-id` is the message ID: the same for every endpoint,
        retry and replay of that message, so receivers can deduplicate. Delivery is at-least-once (a worker crash
        can cause a repeat), and ordering is not guaranteed, not even per endpoint.

        **Outcome:** any `2xx` within the timeout (10 s by default, `DELIVERY_TIMEOUT`) is a success. Redirects
        (`3xx`) are not followed and count as failures, like every other status. The first 4 KB of the response
        body are stored on the attempt (`GET /v1/deliveries/{delivery_id}/attempts`), so do not echo secrets in it.
        No request is sent at all when the endpoint is disabled (attempt error `endpoint_disabled`) or when, in
        production, its host resolves to a private or otherwise blocked address at send time (attempt error
        `destination_blocked`; the destination is checked when the connection is opened, not only at registration).
        Both are terminal: the delivery becomes `failed` and is not retried.
      parameters:
        - $ref: "#/components/parameters/WebhookIDHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
        - name: User-Agent
          in: header
          required: true
          description: Identifies Hookrelay. Always starts with `Hookrelay/` followed by the build version.
          schema:
            type: string
            pattern: "^Hookrelay/\\S+"
            example: "Hookrelay/0.1.0 (+https://github.com/hookrelay/hookrelay)"
      requestBody:
        required: true
        description: The published payload, byte-for-byte. Always a JSON object.
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
            example: { "id": "inv_1", "amount": 1200 }
      responses:
        "2XX":
          description: Delivery succeeded. The delivery becomes `succeeded` and no further attempts are made.
        default:
          description: |
            Any other status (including `3xx`), no response within the timeout (`timeout`), a DNS failure
            (`dns_error`) or a connection or TLS failure (`connection_error`) is a failed attempt. A failed
            automatic attempt is retried, by default (`RETRY_SCHEDULE`, `RETRY_JITTER`), after 5s, 30s, 2m, 15m and 1h
            (each ±10% jitter, measured from the end of the failed attempt), so at most 6 attempts in total; after the last one the delivery becomes
            `failed`. Every retry carries the same `webhook-id` and body with a fresh timestamp and signature.
            Manual replays are not retried. Redirects are never followed.

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: "hr_<43 base64url chars>"
      description: |
        Project API key, shown once at project creation. Stored only as a SHA-256 hash.
        Send as `Authorization: Bearer hr_...`.
    session:
      type: apiKey
      in: header
      name: X-Hookrelay-Session
      description: |
        Neon Auth session (the value of the signed session cookie that Neon Auth issues, 1-2048 RFC 6265
        cookie-octet characters). The Next.js BFF sets it from its encrypted httpOnly `hr_session` cookie.
        Browsers never send it directly. The API checks it with Neon Auth `GET /get-session`. Positive results
        are cached for at most `SESSION_CACHE_TTL` (5 s), so a signed-out session stops working within 5 s.

  headers:
    XRequestId:
      description: Request correlation ID, also present in server logs.
      schema: { type: string }
    IdempotentReplayed:
      description: |
        Present, with value `true`, only when the response was replayed from an earlier request with the same
        `Idempotency-Key`. Absent on a first publish.
      schema: { type: string, enum: ["true"] }
    NoStore:
      description: Always `no-store`.
      schema: { type: string, const: no-store }

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Values above 100, or a `limit` sent more than once, return `400 validation_error` (field `limit`).
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque `next_cursor` from the previous page of the same list. A malformed cursor, or a cursor taken from a
        different kind of list, returns `400` (field `cursor`); so does a `cursor` sent more than once. Cursors do not expire.
      schema: { type: string, maxLength: 512 }
    EndpointID:
      name: endpoint_id
      in: path
      required: true
      description: A value that is not a well-formed endpoint ID returns `404 not_found`, the same as an unknown ID.
      schema: { $ref: "#/components/schemas/EndpointID" }
    MessageID:
      name: message_id
      in: path
      required: true
      description: A value that is not a well-formed message ID returns `404 not_found`, the same as an unknown ID.
      schema: { $ref: "#/components/schemas/MessageID" }
    DeliveryID:
      name: delivery_id
      in: path
      required: true
      description: A value that is not a well-formed delivery ID returns `404 not_found`, the same as an unknown ID.
      schema: { $ref: "#/components/schemas/DeliveryID" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-chosen key that makes a publish safe to retry, for example a UUID. 1 to 255 characters, each
        printable ASCII from `!` (0x21) to `~` (0x7E): no spaces, control characters or non-ASCII. Compared
        exactly (case-sensitive). Scoped to the project and live for 24 hours from the first successful request.
        Omit the header to publish without idempotency. An empty value, a value that breaks these rules, or the
        header sent more than once returns `400 validation_error` with field `Idempotency-Key`.
      schema: { type: string, minLength: 1, maxLength: 255, pattern: "^[\\x21-\\x7E]{1,255}$" }
      example: 7f3c9b2e-1d4a-4e8b-9a61-2c0f5d8e7b14
    WebhookIDHeader:
      name: webhook-id
      in: header
      required: true
      description: The message ID. Stable across retries and replays.
      schema: { $ref: "#/components/schemas/MessageID" }
    DemoWebhookIDHeader:
      name: webhook-id
      in: header
      required: true
      description: |
        The Standard Webhooks message id. Hookrelay sends the message ID (`msg_...`), but the demo receiver accepts
        any id of 1 to 255 printable ASCII characters (`!` to `~`), because it only stores ids whose signature verified.
      schema: { type: string, minLength: 1, maxLength: 255, pattern: "^[\\x21-\\x7E]{1,255}$" }
      example: msg_01JC3ZP4A5B6C7D8E9F0G1H2J3
    WebhookTimestampHeader:
      name: webhook-timestamp
      in: header
      required: true
      description: Unix seconds at send time (fresh for every attempt, so a retry or replay carries a new timestamp and a new signature).
      schema: { type: string, pattern: "^[0-9]{1,12}$", example: "1762600000" }
    WebhookSignatureHeader:
      name: webhook-signature
      in: header
      required: true
      description: |
        Space-separated list of `v1,<base64 signature>`. Hookrelay sends one (two during secret rotation, US-011). The
        demo receiver ignores entries of other versions (for example `v1a,...`), accepts at most 10 entries, and
        succeeds if any `v1` entry matches.
      schema: { type: string, example: "v1,K5oZfzN95Z9UVu1EsfQmfVNQhnkZ2pj9o9NDN/H/pI4=" }

  responses:
    ValidationError:
      description: The request is syntactically invalid. `field` names the failing input.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: validation_error, message: "url must be an absolute http(s) URL", field: url } }
    Unauthorized:
      description: |
        No credential, both credentials, or a malformed, unknown, revoked, expired or signed-out API key or
        session. The body is identical in every case (the message is kept from US-001 for compatibility). The demo
        receiver has its own 401 bodies (see `demoReceive`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: unauthorized, message: "missing or invalid API key" } }
    Forbidden:
      description: The operation is disabled by configuration.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: forbidden, message: "project creation is disabled on this deployment" } }
    NotFound:
      description: The resource does not exist or belongs to another project.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: "endpoint not found" } }
    Conflict:
      description: |
        The request conflicts with current state (for example the endpoint limit is reached; replay has its own
        `ReplayConflict` with both replay messages), or
        `project_not_provisioned` when a verified session has no project yet.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: conflict, message: "endpoint limit of 20 per project reached" } }
    ReplayConflict:
      description: |
        The replay was refused and nothing changed. The code is `conflict` in both replay cases; the message says
        which one. A verified session without a project gets `project_not_provisioned` instead, as on every route.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            endpointDisabled:
              summary: The delivery's endpoint is disabled (checked first)
              value: { error: { code: conflict, message: "endpoint is disabled" } }
            deliveryPending:
              summary: The delivery is already pending (waiting, retry scheduled, or in flight), or a concurrent replay won
              value: { error: { code: conflict, message: "delivery is already pending" } }
            projectNotProvisioned:
              summary: Session without a project yet
              value: { error: { code: project_not_provisioned, message: "project not provisioned for this account yet" } }
    PayloadTooLarge:
      description: Request body exceeds 256 KB. Nothing is stored.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: payload_too_large, message: "request body exceeds 262144 bytes" } }
    IdempotencyKeyMismatch:
      description: The `Idempotency-Key` was already used within 24 hours with a different request body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: idempotency_key_mismatch, message: "Idempotency-Key was already used with a different request body" } }
    ProjectNotProvisioned:
      description: The session is valid but its user has no project yet. Call `POST /v1/me/project` first.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: project_not_provisioned, message: "project not provisioned for this account yet" } }
    AuthUnavailable:
      description: |
        Session requests only. Neon Auth could not verify the session (timeout, network error, 5xx, unexpected
        response). The request fails closed and is never treated as authenticated. Safe to retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: auth_unavailable, message: "authentication service unavailable, try again" } }
    Internal:
      description: Unexpected server error. Never contains internals; correlate with `X-Request-Id`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: internal, message: "internal server error" } }

  schemas:
    # ---------- shared ----------
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string, description: Human readable; safe to show to users. }
            field:
              type: string
              description: Present on `validation_error` when one input failed (body field, `body` for an empty patch, `limit`, `cursor`, `status`, `Idempotency-Key`).
    ErrorCode:
      type: string
      enum:
        - validation_error
        - unauthorized
        - forbidden
        - not_found
        - method_not_allowed
        - conflict
        - payload_too_large
        - idempotency_key_mismatch
        - simulated_failure
        - project_not_provisioned
        - auth_unavailable
        - bad_gateway # BFF only: the dashboard proxy could not reach this API (never returned by the API itself)
        - internal
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC.
    NextCursor:
      type: [string, "null"]
      description: Opaque cursor for the next page; `null` on the last page.
    ProjectID:
      type: string
      pattern: "^proj_[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["proj_01JC3ZK6Q8V2W7T4N5R9XBYH0M"]
    EndpointID:
      type: string
      pattern: "^ep_[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["ep_01JC3ZM2H7Y9D4E6F8G0J1K2M3"]
    MessageID:
      type: string
      pattern: "^msg_[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["msg_01JC3ZP4A5B6C7D8E9F0G1H2J3"]
    DeliveryID:
      type: string
      pattern: "^dlv_[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["dlv_01JC3ZQ8K9M0N1P2Q3R4S5T6V7"]
    AttemptID:
      type: string
      pattern: "^att_[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["att_01JC3ZR1W2X3Y4Z5A6B7C8D9E0"]

    Health:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          required: [database]
          properties:
            database: { type: string, enum: [ok, unreachable] }

    # ---------- projects ----------
    CreateProjectRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Trimmed; must not be empty or whitespace only, and must not contain control
            characters (Unicode Cc).
    Project:
      type: object
      required: [id, name, created_at, demo_receiver_url]
      properties:
        id: { $ref: "#/components/schemas/ProjectID" }
        name: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        demo_receiver_url:
          type: [string, "null"]
          format: uri
          description: |
            URL of the built-in demo receiver for this project (`{DEMO_RECEIVER_BASE_URL}/{project_id}`), or `null`
            when the demo receiver is disabled on this deployment. Register it as an endpoint URL **verbatim**, or with
            `?fail_first=N` appended. The receiver only recognises endpoints whose URL is exactly one of these two forms
            (another spelling of the same URL gets `401`). In production it is the only private destination the SSRF
            guard allows. In local docker compose it is `http://api:8080/...`, which the worker can reach but a browser
            cannot; that is expected.
          examples: ["https://hookrelay.fly.dev/demo/receiver/proj_01JC3ZK6Q8V2W7T4N5R9XBYH0M"]
    ProjectCreated:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [api_key]
          properties:
            api_key:
              type: string
              pattern: "^hr_[A-Za-z0-9_-]{43}$"
              description: Shown once. Store it now; it cannot be retrieved again.

    # ---------- endpoints ----------
    CreateEndpointRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
        description: { type: string, maxLength: 255, default: "" }
    UpdateEndpointRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Absent fields stay unchanged. No field accepts `null`.
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
        description: { type: string, maxLength: 255 }
        enabled: { type: boolean }
    Endpoint:
      type: object
      required: [id, url, description, enabled, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/EndpointID" }
        url: { type: string, format: uri }
        description: { type: string }
        enabled: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    SigningSecret:
      type: string
      pattern: "^whsec_[A-Za-z0-9+/]{43}=$"
      description: "`whsec_` + standard base64 of 32 random bytes. The HMAC key is the decoded bytes."
    EndpointWithSecret:
      allOf:
        - $ref: "#/components/schemas/Endpoint"
        - type: object
          required: [signing_secret]
          properties:
            signing_secret: { $ref: "#/components/schemas/SigningSecret" }
    EndpointSecret:
      type: object
      required: [signing_secret]
      properties:
        signing_secret: { $ref: "#/components/schemas/SigningSecret" }
    EndpointList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Endpoint" }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }

    # ---------- messages ----------
    EventType:
      type: string
      minLength: 1
      maxLength: 100
      pattern: "^[A-Za-z0-9._-]+$"
      examples: ["invoice.paid"]
    PublishMessageRequest:
      type: object
      required: [event_type, payload]
      additionalProperties: false
      description: The whole request body is at most 256 KB (262144 bytes); larger bodies return `413`.
      properties:
        event_type:
          $ref: "#/components/schemas/EventType"
          description: |
            1 to 100 characters from `[A-Za-z0-9._-]`. Missing, `null`, empty, too long or containing any other
            character returns `400 validation_error` with field `event_type`.
        payload:
          type: object
          additionalProperties: true
          description: |
            Any JSON object, as UTF-8. Stored, returned (US-006) and delivered (US-004) byte-for-byte exactly as
            it appears in the request, including its whitespace and key order. Missing, `null`, an array, a
            string, a number, a boolean, or invalid UTF-8 returns `400 validation_error` with field `payload`.
    MessageAccepted:
      type: object
      required: [id, event_type, created_at]
      description: Identical for a first publish and for every idempotent replay of it.
      properties:
        id: { $ref: "#/components/schemas/MessageID" }
        event_type: { $ref: "#/components/schemas/EventType" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    DeliveryCounts:
      type: object
      required: [pending, succeeded, failed]
      description: |
        How many of the message's deliveries are in each status right now (one delivery per endpoint that was
        enabled at publish). A delivery with an attempt in flight counts as `pending`. The three counts add up to
        the number of deliveries.
      properties:
        pending: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
    MessageSummary:
      type: object
      required: [id, event_type, created_at, delivery_summary]
      description: A list item. It never contains `payload`, so a page stays small whatever the payload sizes.
      properties:
        id: { $ref: "#/components/schemas/MessageID" }
        event_type: { $ref: "#/components/schemas/EventType" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        delivery_summary: { $ref: "#/components/schemas/DeliveryCounts" }
    MessageList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/MessageSummary" }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    MessageDetail:
      type: object
      required: [id, event_type, created_at, payload, deliveries]
      properties:
        id: { $ref: "#/components/schemas/MessageID" }
        event_type: { $ref: "#/components/schemas/EventType" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        payload:
          type: object
          additionalProperties: true
          description: Exactly as published (raw JSON embedded byte-for-byte).
        deliveries:
          type: array
          items: { $ref: "#/components/schemas/Delivery" }

    # ---------- deliveries ----------
    DeliveryStatus:
      type: string
      enum: [pending, succeeded, failed]
      description: |
        `pending`: waiting for its first attempt, a scheduled retry or a requested replay, or an attempt is in flight.
        `succeeded`: an attempt got a `2xx`; no further attempts are made.
        `failed`: final. Retries are exhausted, the destination is blocked (`destination_blocked`), the endpoint
        is disabled (`endpoint_disabled`), or a manual replay failed. Only a replay starts it again.
    Delivery:
      type: object
      required: [id, message_id, endpoint_id, status, attempt_count, next_attempt_at, last_attempt_at, created_at]
      properties:
        id: { $ref: "#/components/schemas/DeliveryID" }
        message_id: { $ref: "#/components/schemas/MessageID" }
        endpoint_id: { $ref: "#/components/schemas/EndpointID" }
        status: { $ref: "#/components/schemas/DeliveryStatus" }
        attempt_count:
          type: integer
          minimum: 0
          description: Finished attempts so far (automatic and manual). An attempt cut short by a worker crash is not counted.
        next_attempt_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the next attempt is due: the first attempt, a scheduled retry after a failed automatic
            attempt (backoff with jitter), or the time a replay was requested. While an attempt is in flight it
            is the lease expiry instead.
            `null` when not `pending`.
        last_attempt_at:
          type: [string, "null"]
          format: date-time
          description: |
            `started_at` of the latest finished attempt (equal to that attempt's `started_at` in the attempt list).
            `null` until the first attempt finishes.
        created_at:
          $ref: "#/components/schemas/Timestamp"
          description: When the delivery was created, which is the publish time of its message.
    DeliveryList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Delivery" }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    AttemptError:
      type: [string, "null"]
      enum: [timeout, connection_error, dns_error, destination_blocked, endpoint_disabled, null]
      description: "`null` when the receiver answered with an HTTP status (check `response_status`)."
    AttemptTrigger:
      type: string
      enum: [automatic, manual]
      description: Why the attempt was made.
    Attempt:
      type: object
      required:
        [id, delivery_id, attempt_number, trigger, started_at, duration_ms, response_status, response_body, response_body_truncated, error]
      properties:
        id: { $ref: "#/components/schemas/AttemptID" }
        delivery_id: { $ref: "#/components/schemas/DeliveryID" }
        attempt_number:
          type: integer
          minimum: 1
          description: 1 for the first attempt; keeps counting across retries and manual replays. Unique per delivery.
        trigger:
          $ref: "#/components/schemas/AttemptTrigger"
          description: "`automatic` for the first attempt and scheduled retries, `manual` for a replay (US-007)."
        started_at:
          $ref: "#/components/schemas/Timestamp"
          description: When the worker started the attempt (before DNS and connect).
        duration_ms:
          type: integer
          minimum: 0
          description: Milliseconds from `started_at` until the response body was read or the attempt failed. `0` when no request was made (`endpoint_disabled`).
        response_status:
          type: [integer, "null"]
          minimum: 100
          maximum: 599
          description: HTTP status the receiver answered with (redirects are not followed, so `3xx` appears as is). `null` when there was no response (see `error`).
        response_body:
          type: [string, "null"]
          maxLength: 4096
          description: |
            The first 4096 **bytes** of the response body as UTF-8 (invalid bytes replaced with U+FFFD, NUL bytes
            removed, cut at a character boundary), so it is never more than 4 KB however large the response was.
            `""` when the receiver answered with an empty body; `null` when there was no response. Treat it as
            untrusted text: render it escaped, never as HTML.
        response_body_truncated:
          type: boolean
          description: |
            `true` when the receiver sent more than 4096 bytes (or sanitizing pushed it over) and `response_body`
            holds only the beginning. Always `false` when `response_body` is `null`.
        error: { $ref: "#/components/schemas/AttemptError" }
    AttemptList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Attempt" }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }

    # ---------- demo ----------
    DemoReceiverResult:
      type: object
      required: [received, endpoint_id, webhook_id, request_number, fail_first]
      additionalProperties: false
      properties:
        received: { type: boolean, const: true }
        endpoint_id:
          $ref: "#/components/schemas/EndpointID"
          description: The demo endpoint whose signing secret verified the request.
        webhook_id:
          type: string
          minLength: 1
          maxLength: 255
          description: The `webhook-id` header as received (the message ID when Hookrelay sent it).
        request_number:
          type: integer
          minimum: 1
          description: |
            How many signed requests this (endpoint, webhook-id) pair has made to the receiver, including this one.
            Requests rejected with `401` are not counted. Starts again from 1 after 7 days without a request.
        fail_first:
          type: integer
          minimum: 0
          maximum: 10
          description: The `fail_first` value of this request (0 when absent). Always less than `request_number`.
