version: "2"

run:
  timeout: 5m
  build-tags: [integration] # lint the Testcontainers tests too

# Flat control flow (see .claude/references/backend-architecture.md section 2) and the
# dependency rule (section 1) are enforced here. scripts/check-layers.sh is the
# grep-based backstop that CI runs as well.
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errorlint
    - revive
    - gocritic
    - nestif
    - gocognit
    - cyclop
    - depguard
  settings:
    cyclop:
      max-complexity: 10
    gocognit:
      min-complexity: 12
    nestif:
      # 1 means any if nested inside another if is reported.
      min-complexity: 1
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks:
        - hugeParam
        - ifElseChain # covered by revive early-return / superfluous-else
    revive:
      rules:
        - name: early-return
        - name: indent-error-flow
        - name: superfluous-else
        - name: exported
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: context-as-argument
        - name: context-keys-type
        - name: var-naming
        - name: unused-parameter
        - name: argument-limit
          arguments: [4]
        - name: max-control-nesting
          arguments: [1]
    depguard:
      rules:
        # The rules below encode the per-module sub-package layout (ADR 0010). They name the
        # project module; a new module copies the block and swaps the module name.
        # `lax` mode: everything not denied is allowed, and an `allow` entry exempts a more
        # specific path from a broader `deny` prefix.
        # --- domain/errors: stdlib only ---------------------------------------------
        domain-errors:
          list-mode: lax
          files: ["**/internal/project/domain/errors/**", "!$test"]
          deny:
            - {pkg: net/http, desc: "domain must not depend on net/http"}
            - {pkg: log/slog, desc: "domain must not log"}
            - {pkg: github.com, desc: "domain imports the stdlib only"}
            - {pkg: golang.org, desc: "domain imports the stdlib only"}
            - {pkg: hookrelay, desc: "domain/errors imports nothing from this repo"}
        # --- domain/entity: stdlib + domain/errors ----------------------------------
        domain-entity:
          list-mode: lax
          files: ["**/internal/project/domain/entity/**", "!$test"]
          allow:
            - hookrelay/internal/project/domain/errors
          deny:
            - {pkg: net/http, desc: "domain must not depend on net/http"}
            - {pkg: log/slog, desc: "domain must not log"}
            - {pkg: github.com, desc: "domain imports the stdlib only"}
            - {pkg: golang.org, desc: "domain imports the stdlib only"}
            - {pkg: hookrelay, desc: "entity imports domain/errors only"}
        # --- domain/repository: ports over entity + errors --------------------------
        domain-repository:
          list-mode: lax
          files: ["**/internal/project/domain/repository/**", "!$test"]
          allow:
            - hookrelay/internal/project/domain/entity
            - hookrelay/internal/project/domain/errors
          deny:
            - {pkg: net/http, desc: "domain must not depend on net/http"}
            - {pkg: log/slog, desc: "domain must not log"}
            - {pkg: github.com, desc: "domain imports the stdlib only"}
            - {pkg: golang.org, desc: "domain imports the stdlib only"}
            - {pkg: hookrelay, desc: "repository ports import entity and errors only"}
        # --- domain/usecase: application rules over domain/* ------------------------
        domain-usecase:
          list-mode: lax
          files: ["**/internal/project/domain/usecase/**", "!$test"]
          allow:
            - hookrelay/internal/project/domain/entity
            - hookrelay/internal/project/domain/errors
            - hookrelay/internal/project/domain/repository
          deny:
            - {pkg: net/http, desc: "use cases must not know HTTP"}
            - {pkg: github.com, desc: "use cases must not know pgx or other third-party adapters"}
            - {pkg: golang.org, desc: "use cases import the stdlib and domain/* only"}
            - {pkg: hookrelay, desc: "use cases import domain/* only (not data, delivery or platform)"}
        # --- data/model: plain row structs ------------------------------------------
        data-model:
          list-mode: lax
          files: ["**/internal/project/data/model/**", "!$test"]
          deny:
            - {pkg: github.com, desc: "models are plain structs"}
            - {pkg: golang.org, desc: "models are plain structs"}
            - {pkg: hookrelay, desc: "models import nothing from this repo"}
        # --- data/source: SQL + pgx, returns models ---------------------------------
        data-source:
          list-mode: lax
          files: ["**/internal/project/data/source/**", "!$test"]
          allow:
            - hookrelay/internal/library/postgres
          deny:
            - {pkg: hookrelay/internal/project/domain, desc: "sources return models, not entities"}
            - {pkg: hookrelay/internal/project/delivery, desc: "data must not import delivery"}
            - {pkg: hookrelay/internal/project/data/repository, desc: "sources do not know repositories"}
            - {pkg: hookrelay/internal/platform, desc: "sources reach the database through library/postgres only"}
            - {pkg: hookrelay/internal/library, desc: "sources may import library/postgres only"}
        # --- data/repository: models <-> entities, no SQL ---------------------------
        data-repository:
          list-mode: lax
          files: ["**/internal/project/data/repository/**", "!$test"]
          deny:
            - {pkg: github.com/jackc, desc: "SQL and pgx belong to data/source"}
            - {pkg: net/http, desc: "repositories must not know HTTP"}
            - {pkg: hookrelay/internal/project/delivery, desc: "data must not import delivery"}
            - {pkg: hookrelay/internal/project/domain/usecase, desc: "data must not import use cases"}
            - {pkg: hookrelay/internal/platform, desc: "repositories reach storage through data/source"}
            - {pkg: hookrelay/internal/library, desc: "repositories reach storage through data/source"}
        # --- data/neonauth: outbound HTTP adapter to the identity provider ----------
        data-neonauth:
          list-mode: lax
          files: ["**/internal/project/data/neonauth/**", "!$test"]
          deny:
            - {pkg: github.com/jackc, desc: "the identity adapter does not touch the database"}
            - {pkg: hookrelay/internal/platform, desc: "adapters reach their config through constructor options"}
            - {pkg: hookrelay/internal/library, desc: "adapters reach their config through constructor options"}
            - {pkg: hookrelay/internal/project/delivery, desc: "data must not import delivery"}
            - {pkg: hookrelay/internal/project/domain/usecase, desc: "data must not import use cases"}
            - {pkg: hookrelay/internal/project/data/source, desc: "the identity adapter does not use SQL sources"}
            - {pkg: hookrelay/internal/project/data/repository, desc: "the identity adapter does not use repositories"}
        # --- delivery/dto: plain request/response structs ---------------------------
        delivery-dto:
          list-mode: lax
          files: ["**/internal/project/delivery/dto/**", "!$test"]
          allow:
            - hookrelay/internal/project/domain/entity
          deny:
            - {pkg: net/http, desc: "DTOs are plain structs"}
            - {pkg: github.com, desc: "DTOs are plain structs"}
            - {pkg: hookrelay, desc: "DTOs import domain/entity at most"}
        # --- delivery/presenter/http: handlers over use cases -----------------------
        delivery-presenter:
          list-mode: lax
          files: ["**/internal/project/delivery/presenter/**", "!$test"]
          deny:
            - {pkg: github.com/jackc, desc: "delivery must not touch the database"}
            - {pkg: hookrelay/internal/library, desc: "delivery must not touch libraries or the database"}
            - {pkg: hookrelay/internal/project/data, desc: "delivery must not import data"}
            - {pkg: hookrelay/internal/project/domain/repository, desc: "delivery calls use cases, not repository ports"}
        # --- domain/errors: stdlib only ---------------------------------------------
        endpoint-domain-errors:
          list-mode: lax
          files: ["**/internal/endpoint/domain/errors/**", "!$test"]
          deny:
            - {pkg: net/http, desc: "domain must not depend on net/http"}
            - {pkg: log/slog, desc: "domain must not log"}
            - {pkg: github.com, desc: "domain imports the stdlib only"}
            - {pkg: golang.org, desc: "domain imports the stdlib only"}
            - {pkg: hookrelay, desc: "domain/errors imports nothing from this repo"}
        # --- domain/entity: stdlib + domain/errors ----------------------------------
        endpoint-domain-entity:
          list-mode: lax
          files: ["**/internal/endpoint/domain/entity/**", "!$test"]
          allow:
            - hookrelay/internal/endpoint/domain/errors
          deny:
            - {pkg: net/http, desc: "domain must not depend on net/http"}
            - {pkg: log/slog, desc: "domain must not log"}
            - {pkg: github.com, desc: "domain imports the stdlib only"}
            - {pkg: golang.org, desc: "domain imports the stdlib only"}
            - {pkg: hookrelay, desc: "entity imports domain/errors only"}
        # --- domain/repository: ports over entity + errors --------------------------
        endpoint-domain-repository:
          list-mode: lax
          files: ["**/internal/endpoint/domain/repository/**", "!$test"]
          allow:
            - hookrelay/internal/endpoint/domain/entity
            - hookrelay/internal/endpoint/domain/errors
          deny:
            - {pkg: net/http, desc: "domain must not depend on net/http"}
            - {pkg: log/slog, desc: "domain must not log"}
            - {pkg: github.com, desc: "domain imports the stdlib only"}
            - {pkg: golang.org, desc: "domain imports the stdlib only"}
            - {pkg: hookrelay, desc: "repository ports import entity and errors only"}
        # --- domain/usecase: application rules over domain/* ------------------------
        endpoint-domain-usecase:
          list-mode: lax
          files: ["**/internal/endpoint/domain/usecase/**", "!$test"]
          allow:
            - hookrelay/internal/endpoint/domain/entity
            - hookrelay/internal/endpoint/domain/errors
            - hookrelay/internal/endpoint/domain/repository
          deny:
            - {pkg: net/http, desc: "use cases must not know HTTP"}
            - {pkg: github.com, desc: "use cases must not know pgx or other third-party adapters"}
            - {pkg: golang.org, desc: "use cases import the stdlib and domain/* only"}
            - {pkg: hookrelay, desc: "use cases import domain/* only (not data, delivery or platform)"}
        # --- data/model: plain row structs ------------------------------------------
        endpoint-data-model:
          list-mode: lax
          files: ["**/internal/endpoint/data/model/**", "!$test"]
          deny:
            - {pkg: github.com, desc: "models are plain structs"}
            - {pkg: golang.org, desc: "models are plain structs"}
            - {pkg: hookrelay, desc: "models import nothing from this repo"}
        # --- data/source: SQL + pgx, returns models ---------------------------------
        endpoint-data-source:
          list-mode: lax
          files: ["**/internal/endpoint/data/source/**", "!$test"]
          allow:
            - hookrelay/internal/library/postgres
          deny:
            - {pkg: hookrelay/internal/endpoint/domain, desc: "sources return models, not entities"}
            - {pkg: hookrelay/internal/endpoint/delivery, desc: "data must not import delivery"}
            - {pkg: hookrelay/internal/endpoint/data/repository, desc: "sources do not know repositories"}
            - {pkg: hookrelay/internal/platform, desc: "sources reach the database through library/postgres only"}
            - {pkg: hookrelay/internal/library, desc: "sources may import library/postgres only"}
        # --- data/repository: models <-> entities, no SQL ---------------------------
        endpoint-data-repository:
          list-mode: lax
          files: ["**/internal/endpoint/data/repository/**", "!$test"]
          deny:
            - {pkg: github.com/jackc, desc: "SQL and pgx belong to data/source"}
            - {pkg: net/http, desc: "repositories must not know HTTP"}
            - {pkg: hookrelay/internal/endpoint/delivery, desc: "data must not import delivery"}
            - {pkg: hookrelay/internal/endpoint/domain/usecase, desc: "data must not import use cases"}
            - {pkg: hookrelay/internal/platform, desc: "repositories reach storage through data/source"}
            - {pkg: hookrelay/internal/library, desc: "repositories reach storage through data/source"}
        # --- delivery/dto: plain request/response structs ---------------------------
        endpoint-delivery-dto:
          list-mode: lax
          files: ["**/internal/endpoint/delivery/dto/**", "!$test"]
          allow:
            - hookrelay/internal/endpoint/domain/entity
          deny:
            - {pkg: net/http, desc: "DTOs are plain structs"}
            - {pkg: github.com, desc: "DTOs are plain structs"}
            - {pkg: hookrelay, desc: "DTOs import domain/entity at most"}
        # --- delivery/presenter/http: handlers over use cases -----------------------
        endpoint-delivery-presenter:
          list-mode: lax
          files: ["**/internal/endpoint/delivery/presenter/**", "!$test"]
          deny:
            - {pkg: github.com/jackc, desc: "delivery must not touch the database"}
            - {pkg: hookrelay/internal/library, desc: "delivery must not touch libraries or the database"}
            - {pkg: hookrelay/internal/endpoint/data, desc: "delivery must not import data"}
            - {pkg: hookrelay/internal/endpoint/domain/repository, desc: "delivery calls use cases, not repository ports"}
        # --- domain/errors: stdlib only ---------------------------------------------
        message-domain-errors:
          list-mode: lax
          files: ["**/internal/message/domain/errors/**", "!$test"]
          deny:
            - {pkg: net/http, desc: "domain must not depend on net/http"}
            - {pkg: log/slog, desc: "domain must not log"}
            - {pkg: github.com, desc: "domain imports the stdlib only"}
            - {pkg: golang.org, desc: "domain imports the stdlib only"}
            - {pkg: hookrelay, desc: "domain/errors imports nothing from this repo"}
        # --- domain/entity: stdlib + domain/errors ----------------------------------
        message-domain-entity:
          list-mode: lax
          files: ["**/internal/message/domain/entity/**", "!$test"]
          allow:
            - hookrelay/internal/message/domain/errors
          deny:
            - {pkg: net/http, desc: "domain must not depend on net/http"}
            - {pkg: log/slog, desc: "domain must not log"}
            - {pkg: github.com, desc: "domain imports the stdlib only"}
            - {pkg: golang.org, desc: "domain imports the stdlib only"}
            - {pkg: hookrelay, desc: "entity imports domain/errors only"}
        # --- domain/repository: ports over entity + errors --------------------------
        message-domain-repository:
          list-mode: lax
          files: ["**/internal/message/domain/repository/**", "!$test"]
          allow:
            - hookrelay/internal/message/domain/entity
            - hookrelay/internal/message/domain/errors
          deny:
            - {pkg: net/http, desc: "domain must not depend on net/http"}
            - {pkg: log/slog, desc: "domain must not log"}
            - {pkg: github.com, desc: "domain imports the stdlib only"}
            - {pkg: golang.org, desc: "domain imports the stdlib only"}
            - {pkg: hookrelay, desc: "repository ports import entity and errors only"}
        # --- domain/usecase: application rules over domain/* ------------------------
        message-domain-usecase:
          list-mode: lax
          files: ["**/internal/message/domain/usecase/**", "!$test"]
          allow:
            - hookrelay/internal/message/domain/entity
            - hookrelay/internal/message/domain/errors
            - hookrelay/internal/message/domain/repository
          deny:
            - {pkg: net/http, desc: "use cases must not know HTTP"}
            - {pkg: github.com, desc: "use cases must not know pgx or other third-party adapters"}
            - {pkg: golang.org, desc: "use cases import the stdlib and domain/* only"}
            - {pkg: hookrelay, desc: "use cases import domain/* only (not data, delivery or platform)"}
        # --- data/model: plain row structs ------------------------------------------
        message-data-model:
          list-mode: lax
          files: ["**/internal/message/data/model/**", "!$test"]
          deny:
            - {pkg: github.com, desc: "models are plain structs"}
            - {pkg: golang.org, desc: "models are plain structs"}
            - {pkg: hookrelay, desc: "models import nothing from this repo"}
        # --- data/source: SQL + pgx, returns models ---------------------------------
        message-data-source:
          list-mode: lax
          files: ["**/internal/message/data/source/**", "!$test"]
          allow:
            - hookrelay/internal/library/postgres
          deny:
            - {pkg: hookrelay/internal/message/domain, desc: "sources return models, not entities"}
            - {pkg: hookrelay/internal/message/delivery, desc: "data must not import delivery"}
            - {pkg: hookrelay/internal/message/data/repository, desc: "sources do not know repositories"}
            - {pkg: hookrelay/internal/platform, desc: "sources reach the database through library/postgres only"}
            - {pkg: hookrelay/internal/library, desc: "sources may import library/postgres only"}
        # --- data/repository: models <-> entities, no SQL ---------------------------
        message-data-repository:
          list-mode: lax
          files: ["**/internal/message/data/repository/**", "!$test"]
          deny:
            - {pkg: github.com/jackc, desc: "SQL and pgx belong to data/source"}
            - {pkg: net/http, desc: "repositories must not know HTTP"}
            - {pkg: hookrelay/internal/message/delivery, desc: "data must not import delivery"}
            - {pkg: hookrelay/internal/message/domain/usecase, desc: "data must not import use cases"}
            - {pkg: hookrelay/internal/platform, desc: "repositories reach storage through data/source"}
            - {pkg: hookrelay/internal/library, desc: "repositories reach storage through data/source"}
        # --- delivery/dto: plain request/response structs ---------------------------
        message-delivery-dto:
          list-mode: lax
          files: ["**/internal/message/delivery/dto/**", "!$test"]
          allow:
            - hookrelay/internal/message/domain/entity
          deny:
            - {pkg: net/http, desc: "DTOs are plain structs"}
            - {pkg: github.com, desc: "DTOs are plain structs"}
            - {pkg: hookrelay, desc: "DTOs import domain/entity at most"}
        # --- delivery/presenter/http: handlers over use cases -----------------------
        message-delivery-presenter:
          list-mode: lax
          files: ["**/internal/message/delivery/presenter/**", "!$test"]
          deny:
            - {pkg: github.com/jackc, desc: "delivery must not touch the database"}
            - {pkg: hookrelay/internal/library, desc: "delivery must not touch libraries or the database"}
            - {pkg: hookrelay/internal/message/data, desc: "delivery must not import data"}
            - {pkg: hookrelay/internal/message/domain/repository, desc: "delivery calls use cases, not repository ports"}
        # --- nothing but cmd/server imports data or presenter -----------------------
        no-importing-presenter:
          list-mode: lax
          files: ["**/internal/**", "!$test"]
          deny:
            - {pkg: hookrelay/internal/project/delivery/presenter, desc: "only cmd/server wiring imports presenters"}
            - {pkg: hookrelay/internal/endpoint/delivery/presenter, desc: "only the composition root imports presenters"}
            - {pkg: hookrelay/internal/message/delivery/presenter, desc: "only the composition root imports presenters"}
        no-importing-project-data:
          list-mode: lax
          files: ["**/internal/**", "!**/internal/project/data/**", "!$test"]
          deny:
            - {pkg: hookrelay/internal/project/data, desc: "only the composition root (and data itself) imports data"}
        no-importing-endpoint-data:
          list-mode: lax
          files: ["**/internal/**", "!**/internal/endpoint/data/**", "!$test"]
          deny:
            - {pkg: hookrelay/internal/endpoint/data, desc: "only the composition root (and data itself) imports data"}
        no-importing-message-data:
          list-mode: lax
          files: ["**/internal/**", "!**/internal/message/data/**", "!$test"]
          deny:
            - {pkg: hookrelay/internal/message/data, desc: "only the composition root (and data itself) imports data"}
        # --- nothing under internal imports the composition root or Wire ------------
        no-importing-wire:
          list-mode: lax
          files: ["**/internal/**", "!**/internal/library/**", "!$test"]
          deny:
            - {pkg: hookrelay/wire, desc: "the composition root is imported by cmd/server only"}
            - {pkg: github.com/google/wire, desc: "Wire belongs to the composition root and the library provider sets"}
        # --- a library knows nothing about the application --------------------------
        library-no-app:
          list-mode: lax
          files: ["**/internal/library/**", "!$test"]
          deny:
            - {pkg: hookrelay/internal/platform, desc: "a library must not import platform"}
            - {pkg: hookrelay/internal/library, desc: "a library must not import another library (declare a local interface, bind in backend/wire)"}
            - {pkg: hookrelay/internal/project, desc: "a library must not import a module"}
            - {pkg: hookrelay/internal/endpoint, desc: "a library must not import a module"}
            - {pkg: hookrelay/internal/message, desc: "a library must not import a module"}
            - {pkg: hookrelay/internal/dispatch, desc: "a library must not import a module"}
            - {pkg: hookrelay/internal/demoreceiver, desc: "a library must not import a module"}
            - {pkg: hookrelay/wire, desc: "a library must not import the composition root"}
        # --- platform must never import a domain ------------------------------------
        platform-no-domains:
          list-mode: lax
          files: ["**/internal/platform/**", "!$test"]
          deny:
            - {pkg: hookrelay/internal/library, desc: "platform must not import a library"}
            - {pkg: hookrelay/internal/project, desc: "platform must not import a domain"}
            - {pkg: hookrelay/internal/endpoint, desc: "platform must not import a domain"}
            - {pkg: hookrelay/internal/message, desc: "platform must not import a domain"}
            - {pkg: hookrelay/internal/dispatch, desc: "platform must not import a domain"}
            - {pkg: hookrelay/internal/demoreceiver, desc: "platform must not import a domain"}
        # --- a domain never imports another domain (use caller-declared ports) ------
        project-no-other-domains:
          list-mode: lax
          files: ["**/internal/project/**", "!$test"]
          deny:
            - {pkg: hookrelay/internal/endpoint, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
            - {pkg: hookrelay/internal/message, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
            - {pkg: hookrelay/internal/dispatch, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
            - {pkg: hookrelay/internal/demoreceiver, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
        endpoint-no-other-domains:
          list-mode: lax
          files: ["**/internal/endpoint/**", "!$test"]
          deny:
            - {pkg: hookrelay/internal/project, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
            - {pkg: hookrelay/internal/message, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
            - {pkg: hookrelay/internal/dispatch, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
            - {pkg: hookrelay/internal/demoreceiver, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
        message-no-other-domains:
          list-mode: lax
          files: ["**/internal/message/**", "!$test"]
          deny:
            - {pkg: hookrelay/internal/project, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
            - {pkg: hookrelay/internal/endpoint, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
            - {pkg: hookrelay/internal/dispatch, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
            - {pkg: hookrelay/internal/demoreceiver, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
        dispatch-no-other-domains:
          list-mode: lax
          files: ["**/internal/dispatch/**", "!$test"]
          deny:
            - {pkg: hookrelay/internal/project, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
            - {pkg: hookrelay/internal/endpoint, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
            - {pkg: hookrelay/internal/message, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
            - {pkg: hookrelay/internal/demoreceiver, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
        demoreceiver-no-other-domains:
          list-mode: lax
          files: ["**/internal/demoreceiver/**", "!$test"]
          deny:
            - {pkg: hookrelay/internal/project, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
            - {pkg: hookrelay/internal/endpoint, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
            - {pkg: hookrelay/internal/message, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
            - {pkg: hookrelay/internal/dispatch, desc: "cross-domain calls go through ports + cmd/server/adapters.go"}
  exclusions:
    generated: lax
    paths:
      - sqlcgen
    rules:
      # Table-driven tests nest a loop and a closure by design.
      - path: _test\.go
        linters: [nestif, gocognit, cyclop, revive, gocritic]

formatters:
  enable:
    - gofmt
    - goimports
